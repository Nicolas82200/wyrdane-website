<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/src/assets/site/icons/wyrdane_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="text-scale" content="scale" />

    <title>Wyrdane - A Dark Fantasy Collectible Card Game</title>
    <meta
      name="description"
      content="Wyrdane is a 1v1 dark fantasy collectible card game where board positioning matters as much as the cards in your hand. Follow development and build your deck."
    />
    <link rel="canonical" href="https://wyrdane.com/" />

    <!-- Signale explicitement le nom du site à Google (le nom en gras affiché
         au-dessus de l'URL dans les résultats de recherche) : og:site_name
         seul est un signal plus faible et peut être ignoré au profit du nom
         de domaine brut - le schema.org WebSite avec "name" est la méthode
         documentée par Google pour ce cas précis. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Wyrdane",
        "url": "https://wyrdane.com/"
      }
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wyrdane" />
    <meta property="og:title" content="Wyrdane - A Dark Fantasy Collectible Card Game" />
    <meta
      property="og:description"
      content="Wyrdane is a 1v1 dark fantasy collectible card game where board positioning matters as much as the cards in your hand. Follow development and build your deck."
    />
    <meta property="og:image" content="https://wyrdane.com/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:url" content="https://wyrdane.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wyrdane - A Dark Fantasy Collectible Card Game" />
    <meta
      name="twitter:description"
      content="Wyrdane is a 1v1 dark fantasy collectible card game where board positioning matters as much as the cards in your hand. Follow development and build your deck."
    />
    <meta name="twitter:image" content="https://wyrdane.com/og-home.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
